name: CI

on:
  push:
    branches: [development, master, "refactor/**", "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y probar
        run: ./mvnw -B verify
      - name: Construir imagen Docker
        run: docker build -t sami-api:ci .
