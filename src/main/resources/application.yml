spring:
  application:
    name: sami-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sami?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es dueño del esquema (src/main/resources/db/migration).
      # Usa JPA_DDL_AUTO=validate para comprobar que las entidades coinciden con las migraciones.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 10
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE:false}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never

sami:
  security:
    jwt:
      # Clave HMAC en Base64 (mínimo 256 bits). Generar con: openssl rand -base64 64
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000,http://localhost:8081}
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  bootstrap-admin:
    email: ${SAMI_ADMIN_EMAIL:}
    password: ${SAMI_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
