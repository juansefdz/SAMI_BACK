services:
  mysql:
    image: mysql:8.4
    container_name: sami-mysql
    environment:
      MYSQL_DATABASE: sami
      MYSQL_USER: sami
      MYSQL_PASSWORD: sami
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - sami-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

volumes:
  sami-mysql-data:
